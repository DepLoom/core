name: headless-core-ci
# Run one matrix for PR commits; on push run only after merge to main.
# Avoid two identical matrices per branch update.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    name: "core (${{ matrix.os }}, py${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless Core
        run: python -m pip install -e .
      - name: Headless planner regression suite
        # Covers Z3 + transition, Draft health/targets, registry cache/evidence,
        # workspace topology and source identity without Desktop migrations.
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: CLI and syntax smoke
        run: |
          python -m compileall -q peer_solver_transition.py dependency_live_roadmap_generator.py
          python dependency_live_roadmap_generator.py --help
